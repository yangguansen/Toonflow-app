services:
  toonflow:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${TOONFLOW_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?请设置 SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?请设置 SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_OAUTH_PROVIDERS: ${SUPABASE_OAUTH_PROVIDERS:-github,google}
      TOONFLOW_ADMIN_EMAILS: ${TOONFLOW_ADMIN_EMAILS:-}
      TOONFLOW_PUBLIC_URL: ${TOONFLOW_PUBLIC_URL:-}
      TOONFLOW_COOKIE_SECURE: ${TOONFLOW_COOKIE_SECURE:-false}
      TOONFLOW_APP_VERSION: ${TOONFLOW_APP_VERSION:-2.0.0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOONFLOW_CREDITS_ENABLED: ${TOONFLOW_CREDITS_ENABLED:-false}
      TOONFLOW_CREDIT_USD: ${TOONFLOW_CREDIT_USD:-0.001}
      TOONFLOW_CREDIT_MARKUP_RATE: ${TOONFLOW_CREDIT_MARKUP_RATE:-1.3}
      TOONFLOW_PROVIDER_CONFIGS: ${TOONFLOW_PROVIDER_CONFIGS:-}
    volumes:
      - toonflowData:/app/data

volumes:
  toonflowData:
